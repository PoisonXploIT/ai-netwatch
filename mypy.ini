[mypy]
python_version = 3.12
ignore_missing_imports = True
# data/ esta fuera del control de versiones (gitignore) y contiene scripts
# de una sola vez; no forma parte del producto que se valida en CI.
# Correccion (2026-11-21, S-16): los backups/ tambien quedan fuera, son copias
# de ficheros viejos y mypy no debe validarlos.
exclude = (^data/|^backups/|\.venv/|__pycache__/)
